name: Build feriapp APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: نصب ابزارهای Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: باز کردن پروژه feriapp
        run: |
          rm -rf project
          mkdir project
          unzip -q feriapp-build-ready.zip -d project

      - name: ساخت APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: آماده‌سازی APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/feriapp.apk

      - name: قرار دادن APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: feriapp-apk
          path: output/feriapp.apk
